version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # sharp is bumped by hand, together with ARG SHARP_VERSION in the Dockerfile (the worker image installs that version).
      - dependency-name: sharp
  - package-ecosystem: npm
    directory: /tools/eslint
    schedule:
      interval: weekly
    groups:
      eslint-tools-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The lint toolchain stays on TypeScript 6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint stays on the major that eslint-config-next supports; a new major is moved to by hand.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The image stays on Node 22 LTS, like node-version in the CI; a new major is moved to by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
