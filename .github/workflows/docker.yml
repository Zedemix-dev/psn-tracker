name: CI

# Push only: a pull request from a branch of this repo already shows the branch's push run,
# so a pull_request trigger would run everything twice (Actions minutes are limited on the free plan).
on:
  push:

# A newer push on the same branch cancels the run in progress (never on main, which publishes the image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit

  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psn
          POSTGRES_PASSWORD: psn
          POSTGRES_DB: psn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psn -d psn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://psn:psn@localhost:5432/psn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/pg-smoke.ts

  image:
    runs-on: ubuntu-latest
    needs: [test, pg-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zedemix-dev/psn-tracker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        env:
          # No build-record artifact per run: the job summary is enough, and artifacts eat the storage quota.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # One plain image per push (no attestation manifests), so each push is a single GHCR version.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keep the 3 newest images (the current one + 2 to roll back to); older ones are deleted.
      # Needs the package's "Manage Actions access" to give this repository the Admin role (see deploy/README.md).
      - name: Prune old images in GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: /${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}/${{ github.repository_owner }}/packages/container/psn-tracker/versions
        run: |
          set -euo pipefail
          old=$(gh api --paginate "$VERSIONS?per_page=100" --jq '.[] | "\(.created_at) \(.id)"' | sort -r | tail -n +4 | cut -d' ' -f2)
          for id in $old; do
            gh api -X DELETE "$VERSIONS/$id"
            echo "Deleted image version $id"
          done
