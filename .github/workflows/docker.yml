name: CI

# CI runs only when it matters (spec 21.9): on a pull request to main (and each push to it), on main
# itself (which publishes the image), or by hand ("Run workflow" in the Actions tab). Pushes to working
# branches run nothing: work is pushed after every commit, and the free plan's Actions minutes ran out
# in November 2026 when every push ran the whole pipeline. Docs-only changes never run CI.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".superpowers/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".superpowers/**"
      - "**/*.md"
  workflow_dispatch:

# A newer push to the same pull request cancels the run in progress (never on main, which publishes the image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tools/eslint
      - run: npm run lint
      - run: npx vitest run
      - run: npx tsc --noEmit

  pg-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psn
          POSTGRES_PASSWORD: psn
          POSTGRES_DB: psn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psn -d psn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://psn:psn@localhost:5432/psn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/pg-smoke.ts
      # The worker bundle, built exactly as in the Dockerfile, must reach "[worker] started"
      # (migrations applied, interrupted runs marked). Throwaway values: nothing here is a secret.
      - name: Bundle the worker
        run: >-
          npx esbuild src/worker/index.ts --bundle --platform=node --target=node22
          --external:@electric-sql/pglite --external:sharp --outfile=dist/worker.js
      - name: Check that the worker starts
        env:
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD_HASH: ci-not-a-real-hash
          APP_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MEDIA_DIR: ${{ runner.temp }}/media
        run: node scripts/worker-smoke.mjs

  # The real nginx image with the real config, in front of a stub app (not required by "image").
  nginx-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash scripts/ci/nginx-smoke.sh

  image:
    runs-on: ubuntu-latest
    needs: [test, pg-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zedemix-dev/psn-tracker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      # Build once, load it into the local Docker, test that exact image, then push those same tags (main only).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build-record artifact per run: the job summary is enough, and artifacts eat the storage quota.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          # One plain image per push (no attestation manifests), so each push is a single GHCR version.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            psn-tracker:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The real image with the hardened settings of deploy/stack-site.yml, in front of a real PostgreSQL.
      # A failure here blocks the publication below.
      - name: Test the hardened containers
        run: bash scripts/ci/stack-smoke.sh psn-tracker:ci
      - name: Push the tested image to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # The sha tag(s) first and latest last: a failed push never leaves latest moved while the job is red.
          # (printf's "\n" is a newline for the shell; a literal line break here would end this YAML block.)
          for tag in $(printf '%s\n' $TAGS | grep -v ':latest$') $(printf '%s\n' $TAGS | grep ':latest$'); do
            docker push "$tag"
          done
      # Keep the 3 newest images (the current one + 2 to roll back to); older ones are deleted.
      # Needs the package's "Manage Actions access" to give this repository the Admin role (see deploy/README.md).
      - name: Prune old images in GHCR
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: /${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}/${{ github.repository_owner }}/packages/container/psn-tracker/versions
        run: |
          set -euo pipefail
          old=$(gh api --paginate "$VERSIONS?per_page=100" --jq '.[] | "\(.created_at) \(.id)"' | sort -r | tail -n +4 | cut -d' ' -f2)
          for id in $old; do
            gh api -X DELETE "$VERSIONS/$id"
            echo "Deleted image version $id"
          done
