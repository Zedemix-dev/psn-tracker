# Behind the DSM reverse proxy (which terminates TLS and forwards to port 8080 of this container).
server {
    listen 80;
    server_name _;

    # Banner uploads are up to 10 MB; keep in sync with next.config.ts.
    client_max_body_size 12m;

    # DSM reaches nginx through the Docker bridge or the loopback: those are the only trusted
    # proxies. A LAN address is not trusted, so a device on the network cannot invent
    # X-Forwarded-For (DSM appends the real client address after whatever the client sent).
    # If psn-net is not inside 172.16.0.0/12, put its subnet here (deploy/README.md, step 3).
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Next already compresses pages, RSC payloads and static files, but not the /api route handlers.
    # nginx never recompresses a response that already has Content-Encoding. text/x-component is
    # left out on purpose, so a streamed response is never held back.
    gzip on;
    # The DSM reverse proxy may forward in HTTP/1.0, and nginx only compresses HTTP/1.1 requests by default.
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json;

    # Docker embedded DNS + variable: "app" is re-resolved at request time, so nginx starts even if
    # the site stack is not up yet and follows the app container after a re-pull.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # DSM terminates TLS: nginx itself only sees http, so never use $scheme here.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 10 MB uploads over a slow link. The Plat Wall PNG export is the one request that can take
        # several seconds, well under these limits.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}
