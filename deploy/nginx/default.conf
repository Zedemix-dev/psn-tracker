# Behind the DSM reverse proxy (which terminates TLS and forwards to port 8080 of this container).
server {
    listen 80;
    server_name _;

    # Banner uploads are up to 10 MB; keep in sync with next.config.ts.
    client_max_body_size 12m;

    # Trust X-Forwarded-For only from private networks (DSM, docker bridge).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # DSM terminates TLS: nginx itself only sees http, so never use $scheme here.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 10 MB uploads over a slow link; no long-running requests expected.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}
