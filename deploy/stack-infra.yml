# Stack "infra": database + web front (nginx). Deploy this one first.
# Variable: POSTGRES_PASSWORD (Portainer "Environment variables").
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: psn
      POSTGRES_DB: psn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /volume1/docker/psn-tracker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psn -d psn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psn-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # Localhost only: the DSM reverse proxy reaches nginx locally; LAN clients cannot forge X-Forwarded-For.
      - "127.0.0.1:8080:80"
    volumes:
      - /volume1/docker/psn-tracker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - psn-net

networks:
  psn-net:
    external: true
